name: Android APK Build
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: npm install
      - name: Read app version
        id: app-version
        run: echo version=$(node -p 'require("./package.json").version') >> "$GITHUB_OUTPUT"
      - name: Prepare web assets
        run: npm run android:prepare
      - name: Add Capacitor Android project
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Build debug APK
        run: cd android && ./gradlew assembleDebug
      - name: Build release APK (requires repository signing secrets)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          cd android
          ./gradlew assembleRelease
          APK="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [ ! -f "$APK" ]; then APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n1)"; fi
          BUILD_TOOLS="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)"
          "$BUILD_TOOLS/zipalign" -v -p 4 "$APK" "$RUNNER_TEMP/app-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$RUNNER_TEMP/二维码制作-${{ steps.app-version.outputs.version }}-release.apk" "$RUNNER_TEMP/app-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$RUNNER_TEMP/二维码制作-${{ steps.app-version.outputs.version }}-release.apk"
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Stage APKs
        run: |
          mkdir -p release-artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/二维码制作-${{ steps.app-version.outputs.version }}-debug.apk
          if [ -f "$RUNNER_TEMP/二维码制作-${{ steps.app-version.outputs.version }}-release.apk" ]; then cp "$RUNNER_TEMP/二维码制作-${{ steps.app-version.outputs.version }}-release.apk" release-artifacts/; fi
          sha256sum release-artifacts/* > release-artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: QR-code-maker-Android-${{ steps.app-version.outputs.version }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 30
